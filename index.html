<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camila Calegari</title>
  <meta name="description" content="Fale com a gente pelo WhatsApp.">

  <!-- Verificação de domínio da Meta (BM): cole a meta tag aqui, por exemplo:
  <meta name="facebook-domain-verification" content="SEU_CODIGO_AQUI" />
  -->

  <style>
    :root {
      --bg: #f6f8f7;
      --text: #1b2a24;
      --muted: #5d6b65;
      --green: #25d366;
      --green-dark: #1ebe5a;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #101614; --text: #eef3f0; --muted: #9aaaa3; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    main { max-width: 420px; width: 100%; }
    h1 { font-size: 1.9rem; margin: 0 0 12px; }
    p { color: var(--muted); font-size: 1.05rem; line-height: 1.5; margin: 0 0 28px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 24px;
      background: var(--green);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 999px;
      transition: background .15s;
    }
    .btn:hover { background: var(--green-dark); }
    .btn svg { width: 24px; height: 24px; fill: currentColor; }
    footer { margin-top: 32px; font-size: .85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Camila Calegari</h1>
    <p>Fale com a gente diretamente pelo WhatsApp.</p>

    <!-- Troque o href pelo seu link do WhatsApp -->
    <a class="btn" href="LINK_DO_WHATSAPP_AQUI" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.7-.8-1.9-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.4-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.1-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.300.5 1.700.6.700.2 1.400.2 1.900.1.600-.1 1.700-.7 1.900-1.400.2-.7.2-1.200.2-1.400-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.600 15.100L2 22l5-1.300A10 10 0 1 0 12 2zm0 18.200c-1.500 0-3-.4-4.200-1.200l-.3-.2-3 .8.8-2.900-.2-.3A8.200 8.200 0 1 1 12 20.200z"/></svg>
      Chamar no WhatsApp
    </a>

    <footer>&copy; Camila Calegari</footer>
  </main>
</body>
</html>
